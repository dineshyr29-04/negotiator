<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Negotiator — Merchant History Vault (MongoDB)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
          },
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            },
            warm: {
              bg: '#FAF6F0',
              card: '#FFFFFF',
              border: '#F1E9DE',
              subtle: '#F7EFE6',
              text: '#201815',
              muted: '#7A6E65',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FAF6F0;
      color: #201815;
    }
    .warm-radial-glow {
      background: radial-gradient(circle at 85% 15%, rgba(251, 146, 60, 0.22) 0%, transparent 60%);
    }
  </style>
</head>
<body class="min-h-screen warm-radial-glow font-sans antialiased selection:bg-brand-200">

  <!-- Navigation -->
  <header class="bg-white/90 backdrop-blur-md border-b border-warm-border px-4 sm:px-8 py-4 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="/" class="w-9 h-9 rounded-2xl bg-brand-600 flex items-center justify-center text-white shadow-sm hover:bg-brand-700 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        </a>
        <div>
          <span class="font-bold text-lg sm:text-xl tracking-tight text-warm-text">VoiceAgent</span>
          <span class="ml-1 text-xs px-2.5 py-0.5 rounded-full bg-brand-100 text-brand-800 font-semibold">Merchant Vault</span>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <a href="/call" class="px-4 py-2 rounded-full bg-warm-subtle hover:bg-brand-100 border border-warm-border text-xs font-semibold text-warm-text transition">
          🎙️ Live Call Tester
        </a>
        <span class="inline-flex items-center space-x-1.5 text-xs font-semibold px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>MongoDB Storage Active</span>
        </span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-8 py-8 space-y-8">
    
    <!-- Top Header & Search Filter -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div>
        <span class="text-xs font-bold uppercase tracking-wider text-brand-700 bg-brand-100 px-3 py-1 rounded-full">Database Records</span>
        <h1 class="font-serif text-3xl sm:text-4xl text-warm-text mt-2 font-bold">Grouped Merchant Call Histories</h1>
        <p class="text-xs sm:text-sm text-warm-muted mt-1">All multi-turn voice negotiations categorized by vendor name with company stances, savings, and full transcripts.</p>
      </div>

      <div class="w-full md:w-80">
        <input id="search-merchant-input" oninput="filterMerchants()" type="text" class="w-full p-3 rounded-2xl border border-warm-border bg-white text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20" placeholder="Filter by merchant name...">
      </div>
    </div>

    <!-- Merchants Accordion / Cards List -->
    <div id="merchants-container" class="space-y-6">
      <div class="text-center py-12 text-warm-muted text-sm animate-pulse">
        Loading merchant records from database...
      </div>
    </div>

  </main>

  <!-- Global Audio Player -->
  <audio id="history-audio-player" class="hidden"></audio>

  <script>
    let allGroupedData = {};
    const audioPlayer = document.getElementById('history-audio-player');

    async function loadMerchants() {
      const container = document.getElementById('merchants-container');
      try {
        const res = await fetch('/api/merchants');
        allGroupedData = await res.json();
        renderMerchants(allGroupedData);
      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="text-center py-12 text-red-600 text-sm">Failed to load records from server.</div>';
      }
    }

    function renderMerchants(grouped) {
      const container = document.getElementById('merchants-container');
      container.innerHTML = '';

      const merchantNames = Object.keys(grouped);
      if (merchantNames.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-warm-muted text-sm">No merchant records saved yet. Start a call to save one!</div>';
        return;
      }

      merchantNames.forEach(merchant => {
        const records = grouped[merchant];
        const totalCalls = records.length;
        const totalSaved = records.reduce((acc, r) => acc + (r.savings || 0), 0);
        const latestCompanyStance = records[0].company_stance || "Strict corporate budget mandate";

        const card = document.createElement('div');
        card.className = "bg-white rounded-3xl border border-warm-border shadow-sm overflow-hidden p-6 sm:p-8 space-y-5";
        
        card.innerHTML = `
          <!-- Merchant Card Header -->
          <div class="flex flex-col md:flex-row md:items-center justify-between pb-5 border-b border-warm-border gap-4">
            <div>
              <div class="flex items-center space-x-2">
                <h2 class="font-serif text-2xl font-bold text-warm-text">${merchant}</h2>
                <span class="text-xs px-2.5 py-0.5 rounded-full bg-brand-100 text-brand-800 font-bold">${totalCalls} ${totalCalls === 1 ? 'Call' : 'Calls'} Recorded</span>
              </div>
              <div class="text-xs text-warm-muted mt-1"><span class="font-bold text-warm-text">Company Stance:</span> "${latestCompanyStance}"</div>
            </div>

            <div class="flex items-center space-x-4">
              <div class="text-right">
                <div class="text-[10px] uppercase font-bold text-warm-muted">Total Net Saved</div>
                <div class="text-lg font-bold text-emerald-700">+$${totalSaved.toLocaleString()}</div>
              </div>
            </div>
          </div>

          <!-- List of Calls for this Merchant -->
          <div class="space-y-4">
            ${records.map((r, idx) => `
              <div class="p-4 sm:p-5 rounded-2xl bg-warm-bg/50 border border-warm-border space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div class="flex items-center space-x-2">
                    <span class="text-xs font-bold text-warm-text">Session #${idx + 1}</span>
                    <span class="text-[11px] text-warm-muted">${r.timestamp || 'Today'}</span>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200">${r.status || 'Deal Secured'}</span>
                  </div>

                  <div class="flex items-center space-x-4 text-xs">
                    <div>Initial: <span class="line-through text-warm-muted font-medium">$${r.initial_offer?.toLocaleString()}</span></div>
                    <div class="font-bold text-warm-text">Final: <span class="text-brand-700">$${r.final_price?.toLocaleString()}</span></div>
                    <div class="font-bold text-emerald-700">Saved: $${r.savings?.toLocaleString()}</div>
                  </div>
                </div>

                ${r.evidence_quote ? `
                  <div class="p-3 rounded-xl bg-brand-50 border border-brand-200 text-xs text-brand-950 italic flex items-center justify-between">
                    <div><span class="font-bold uppercase text-[10px] text-brand-800 not-italic">Verbal Agreement Evidence:</span> "${r.evidence_quote}"</div>
                    <button onclick="playSnippet('${r.evidence_quote.replace(/'/g, "\\'")}')" class="ml-3 px-3 py-1 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-[10px] font-bold flex-shrink-0">
                      🔊 Play Proof
                    </button>
                  </div>
                ` : ''}

                <!-- Transcript preview -->
                <div class="pt-2">
                  <div class="text-[11px] font-bold uppercase tracking-wider text-warm-muted mb-2">Multi-Turn Transcript:</div>
                  <div class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                    ${(r.dialogue_history || []).map(d => `
                      <div class="text-xs leading-relaxed p-2 rounded-lg ${d.speaker === 'Agent' ? 'bg-brand-50/70 border border-brand-200/60' : 'bg-white border border-warm-border'}">
                        <span class="font-bold ${d.speaker === 'Agent' ? 'text-brand-800' : 'text-warm-text'}">${d.speaker}:</span>
                        <span>"${d.text}"</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterMerchants() {
      const q = document.getElementById('search-merchant-input').value.toLowerCase().trim();
      const filtered = {};
      Object.keys(allGroupedData).forEach(name => {
        if (name.toLowerCase().includes(q)) {
          filtered[name] = allGroupedData[name];
        }
      });
      renderMerchants(filtered);
    }

    async function playSnippet(text) {
      try {
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, voice: 'en-US-JennyNeural' })
        });
        const blob = await res.blob();
        audioPlayer.src = URL.createObjectURL(blob);
        audioPlayer.play();
      } catch (e) {
        console.error(e);
      }
    }

    // Init
    loadMerchants();
  </script>
</body>
</html>
